# Blue/Green 배포 — nginx 리버스 프록시 사이트 설정
# 서버에서: sudo cp deploy/nginx-cocobackend.conf /etc/nginx/conf.d/cocobackend.conf
# 주의: sites-available/sites-enabled 관례가 아니라 conf.d에 직접 설치한다 —
# 배포판에 따라 nginx.conf가 sites-enabled를 include하지 않는 경우가 있어
# (`grep include /etc/nginx/nginx.conf`로 먼저 확인 권장) conf.d로 통일함.
# 실제 활성 포트(blue=8080/green=8081)는 이 파일이 아니라
# /etc/nginx/conf.d/cocobackend_upstream.conf 에서 switch-active.sh가 전환한다.
# 최초 1회 설정 절차 전체는 deploy/BLUEGREEN_SETUP.md 참고.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://cocobackend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
