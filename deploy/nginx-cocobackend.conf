# Blue/Green 배포 — nginx 리버스 프록시 사이트 설정
# 서버에서: /etc/nginx/conf.d/cocobackend.conf
# 주의: sites-available/sites-enabled 관례가 아니라 conf.d에 직접 설치한다 —
# 배포판에 따라 nginx.conf가 sites-enabled를 include하지 않는 경우가 있어
# (`grep include /etc/nginx/nginx.conf`로 먼저 확인 권장) conf.d로 통일함.
# 실제 활성 포트(blue=8080/green=8081)는 이 파일이 아니라
# /etc/nginx/conf.d/cocobackend_upstream.conf 에서 switch-active.sh가 전환한다.
# 최초 1회 설정 절차 전체는 deploy/BLUEGREEN_SETUP.md 참고.

# 요청 IP·네트워크 정보 로깅용 커스텀 access_log 포맷 (2026-09-05)
# 주의: FE(Netlify)가 CORS 회피 위해 자체 프록시로 이 서버를 호출하므로
#   remote_addr = Netlify 프록시의 유동 IP (요청마다 값이 고정적으로 보일 수 있음, 실사용자 IP 아님)
#   client_ip($http_x_forwarded_for) = "실사용자IP, Netlify 내부 NAT IP" 형태 체인 — 맨 앞 값이 실사용자 IP
log_format cocobackend_named
    'time=[$time_local] remote_addr=$remote_addr client_ip="$http_x_forwarded_for" '
    'method=$request_method uri="$request_uri" status=$status '
    'request_time=$request_time upstream_time=$upstream_response_time '
    'referer="$http_referer" user_agent="$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/cocobackend-access.log cocobackend_named;

    location / {
        proxy_pass http://cocobackend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
