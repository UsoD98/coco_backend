name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Rename jar to app.jar
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          cp "$JAR_FILE" build/libs/app.jar

      - name: Copy jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "build/libs/app.jar"
          target: "/home/ubuntu/cocobackend/"
          strip_components: 2

      - name: Write environment file on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TOURAPI_SERVICE_KEY: ${{ secrets.TOURAPI_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FRONT_ORIGIN: ${{ secrets.FRONT_ORIGIN }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,JWT_SECRET,TOURAPI_SERVICE_KEY,GROQ_API_KEY,FRONT_ORIGIN,COOKIE_SECURE
          script: |
            cat > /home/ubuntu/cocobackend/.env <<EOF
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_NAME=$DB_NAME
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            JWT_SECRET=$JWT_SECRET
            TOURAPI_SERVICE_KEY=$TOURAPI_SERVICE_KEY
            GROQ_API_KEY=$GROQ_API_KEY
            FRONT_ORIGIN=$FRONT_ORIGIN
            COOKIE_SECURE=$COOKIE_SECURE
            EOF
            chmod 600 /home/ubuntu/cocobackend/.env

      - name: Blue/Green switch
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            ACTIVE=$(cat /home/ubuntu/cocobackend/active_color 2>/dev/null || echo blue)
            if [ "$ACTIVE" = "blue" ]; then
              INACTIVE=green
              INACTIVE_PORT=8081
            else
              INACTIVE=blue
              INACTIVE_PORT=8080
            fi

            echo "Active slot: $ACTIVE, deploying to: $INACTIVE (port $INACTIVE_PORT)"
            cp /home/ubuntu/cocobackend/app.jar /home/ubuntu/cocobackend-$INACTIVE/app.jar
            sudo systemctl restart cocobackend-$INACTIVE

            HEALTHY=0
            for i in $(seq 1 30); do
              if curl -sf "http://127.0.0.1:$INACTIVE_PORT/actuator/health" | grep -q '"status":"UP"'; then
                HEALTHY=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Health check failed for $INACTIVE on port $INACTIVE_PORT — leaving $ACTIVE active."
              exit 1
            fi

            sudo /home/ubuntu/cocobackend/switch-active.sh $INACTIVE_PORT
            echo "$INACTIVE" > /home/ubuntu/cocobackend/active_color
            sudo systemctl stop cocobackend-$ACTIVE
            echo "Switched active slot to $INACTIVE, stopped $ACTIVE."
